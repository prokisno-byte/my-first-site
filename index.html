<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Skin Shop</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; padding: 0;
            background-color: #1a1d20; color: #f0f2f5;
            text-align: center;
        }
        header { background-color: #22272e; padding: 30px; border-bottom: 2px solid #2ea44f; }
        h1 { margin: 0; color: #ffffff; font-size: 28px; }
        p { color: #adbac7; margin: 10px 0 0 0; }
        
        .shop-container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 25px; padding: 40px 20px; max-width: 1200px; margin: 0 auto;
        }
        .skin-card {
            background-color: #22272e; border: 1px solid #444c56;
            border-radius: 8px; width: 260px; padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .skin-card:hover { transform: translateY(-5px); border-color: #2ea44f; }
        
        .skin-image-container {
            width: 100%; height: 140px; background-color: #1c2128;
            border-radius: 6px; display: flex; align-items: center;
            justify-content: center; margin-bottom: 15px;
            overflow: hidden;
        }
        .skin-image-container img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .skin-title { font-size: 18px; font-weight: bold; margin: 10px 0; color: #ffffff; }
        .skin-price { font-size: 20px; color: #2ea44f; font-weight: bold; margin-bottom: 15px; }
        
        .btn-buy {
            display: block; width: 100%; padding: 10px 0;
            background-color: #2ea44f; color: white; font-weight: bold;
            text-decoration: none; border-radius: 6px; transition: background-color 0.2s;
            box-sizing: border-box;
        }
        .btn-buy:hover { background-color: #2c974b; }
    </style>
</head>
<body>

    <header>
        <h1>CS2 Skin Shop & Донат</h1>
        <p>Покупка топовых скинов без переплат</p>
    </header>

    <div class="shop-container">
        <!-- Скин 1: Керамбит Градиент -->
        <div class="skin-card">
            <div class="skin-image-container">
                <img src="https://steamcommunity-a.akamaihd.net/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1Q7uCvZaZkNM-SD1iWwOpzj-1gSCGn20tztm_UyIn_JHKUbgYlWMcmQ-ZcskSwldS0MOnntAfd3YlMzH35jntXrnE8SOGRGG8" alt="Керамбит | Градиент">
            </div>
            <div class="skin-title">Керамбит | Градиент</div>
            <div class="skin-price">20 000 ₴</div>
            <a href="register.html?item=Karambit_Fade&price=20000_UAH" class="btn-buy">Купить</a>
        </div>

        <!-- Скин 2: AK-47 Вулкан -->
        <div class="skin-card">
            <div class="skin-image-container">
                <img src="https://steamcommunity-a.akamaihd.net/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV086jloKOhcj5Nr_Yg2Yf6cR02LmS9tn3ilK1qBVkMGzyIICRdgRvYVCDqwTsyO7n1JTo6M7PwGwj5Hei-fvc4A" alt="AK-47 | Вулкан">
            </div>
            <div class="skin-title">AK-47 | Вулкан</div>
            <div class="skin-price">5 500 ₴</div>
            <a href="register.html?item=AK47_Vulcan&price=5500_UAH" class="btn-buy">Купить</a>
        </div>

        <!-- Скин 3: AWP Азимов -->
        <div class="skin-card">
            <div class="skin-image-container">
                <img src="https://steamcommunity-a.akamaihd.net/economy/image/i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyLwiYbf_jdk7uW-V6V-Kf2cGFiYxO9gqa9sSS_mwR4h4D6Az9ardyqQa1NyDpIkTOBb5ES7wYDiMOyz4lPf2YsX02yg2Ubsh123" alt="AWP | Азимов">
            </div>
            <div class="skin-title">AWP | Азимов</div>
            <div class="skin-price">4 300 ₴</div>
            <a href="register.html?item=AWP_Asiimov&price=4300_UAH" class="btn-buy">Купить</a>
        </div>
    </div>

</body>
</html>
