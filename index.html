<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding-top: 100px; 
            background-color: #f4f6f9; 
            color: #333;
        }
        h1 { color: #24292e; font-size: 32px; margin-bottom: 10px; }
        p { color: #586069; font-size: 18px; margin-bottom: 30px; }
        
        /* Стили для красивой кнопки */
        .btn-register {
            display: inline-block;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #2ea44f; /* Зеленый цвет */
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
        }
        /* Эффект при наведении мышки */
        .btn-register:hover {
            background-color: #2c974b;
        }
        /* Эффект при клике */
        .btn-register:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>Ура! Мой бесплатный сайт работает!</h1>
    <p>Проект успешно запущен на GitHub Pages без конструкторов и Google.</p>
    
    <!-- Сама кнопка -->
    <a href="https://forms.gle" target="_blank" class="btn-register">Зарегистрироваться на сайте</a>

</body>
</html>
